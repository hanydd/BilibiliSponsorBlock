name: Check Chrome Web Store access

on:
  schedule:
    # Monday 09:23 Asia/Hong_Kong (UTC+8).
    - cron: '23 1 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-chrome-credentials
  cancel-in-progress: false

jobs:
  test:
    name: Test credential checker
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'

      - name: Test credential checker
        run: node --test scripts/check-chrome-credentials.test.mjs

  check:
    name: Verify Chrome Web Store access
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: browser-stores
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'

      - id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.CWS_WIF_PROVIDER }}
          service_account: ${{ vars.CWS_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/chromewebstore
          access_token_lifetime: 1800s
          create_credentials_file: false
          export_environment_variables: false

      - name: Check Chrome Web Store access
        env:
          CHROME_PUBLISHER_ID: ${{ vars.CHROME_PUBLISHER_ID }}
          CHROME_ITEM_ID: ${{ vars.CHROME_ITEM_ID || 'eaoelafamejbnggahofapllmfhlhajdd' }}
          CWS_ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
        run: node scripts/check-chrome-credentials.mjs
