name: Check Chrome credentials

on:
  schedule:
    # Monday 09:23 Asia/Hong_Kong (UTC+8).
    - cron: '23 1 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-chrome-credentials
  cancel-in-progress: false

jobs:
  check:
    name: Verify Chrome OAuth and store access
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: browser-stores

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'

      - name: Test credential checker
        run: node --test scripts/check-chrome-credentials.test.mjs

      - name: Check Chrome credentials
        env:
          CHROME_PUBLISHER_ID: ${{ vars.CHROME_PUBLISHER_ID }}
          CHROME_ITEM_ID: ${{ vars.CHROME_ITEM_ID || 'eaoelafamejbnggahofapllmfhlhajdd' }}
          CHROME_CLIENT_ID: ${{ secrets.CHROME_CLIENT_ID }}
          CHROME_CLIENT_SECRET: ${{ secrets.CHROME_CLIENT_SECRET }}
          CHROME_REFRESH_TOKEN: ${{ secrets.CHROME_REFRESH_TOKEN }}
        run: node scripts/check-chrome-credentials.mjs
