name: Upload Release Build

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:

  safari-macos:
    name: Build Safari macOS app
    uses: ./.github/workflows/safari-macos.yml
    permissions:
      contents: read

  upload-safari-macos:
    name: Upload Safari macOS app to release
    needs: safari-macos
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Safari-macOS-universal
          path: safari-release
      - name: Upload app to the triggering release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$RELEASE_TAG" safari-release/Safari-macOS-universal.zip --clobber

  build:
    name: Upload Release
    runs-on: ubuntu-latest

    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      # Initialization
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Copy configuration
        run: cp config.json.example config.json

      - run: npm ci

      # Create Chrome artifacts
      - name: Create Chrome artifacts
        run: npm run build:chrome
      - run: mkdir ./builds
      - name: Zip Artifacts
        run: cd ./dist ; zip -r ../builds/ChromeExtension.zip *
      - name: Upload ChromeExtension to release
        uses: Shopify/upload-to-release@v2.0.0
        with:
          name: ChromeExtension.zip
          path: ./builds/ChromeExtension.zip
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      # Create Chrome crx file
      # - name: Create Chrome CRX
      #  uses: cardinalby/webext-buildtools-chrome-crx-action@v2
      #  with:
      #    zipFilePath: ./builds/ChromeExtension.zip
      #    crxFilePath: ./builds/ChromeExtension.crx
      #    privateKey: ${{ secrets.PEM_KEY }}
      # - name: Upload Chrome.crx to release
      #  uses: Shopify/upload-to-release@v2.0.0
      #  with:
      #    name: Chrome
      #    path: ./builds/ChromeExtension.crx
      #    repo-token: ${{ secrets.GITHUB_TOKEN }}

      # Create Firefox artifacts
      - name: Create Firefox artifacts
        run: npm run build:firefox
      - name: Zip Artifacts
        run: cd ./dist ; zip -r ../builds/FirefoxExtension.zip *
      - name: Upload FirefoxExtension to release
        uses: Shopify/upload-to-release@v2.0.0
        with:
          name: FirefoxExtension.zip
          path: ./builds/FirefoxExtension.zip
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      # Create Edge artifacts
      - name: Clear dist for Edge
        run: rm -rf ./dist
      - name: Create Edge artifacts
        run: npm run build:edge
      - name: Zip Artifacts
        run: cd ./dist ; zip -r ../builds/EdgeExtension.zip *
      - name: Upload EdgeExtension to release
        uses: Shopify/upload-to-release@v2.0.0
        with:
          name: EdgeExtension.zip
          path: ./builds/EdgeExtension.zip
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      # Create Safari artifacts
      - name: Clear dist for Safari
        run: rm -rf ./dist
      - name: Create Safari artifacts
        run: npm run build:safari
      - name: Zip Artifacts
        run: cd ./dist ; zip -r ../builds/SafariExtension.zip *
      - name: Upload SafariExtension to release
        uses: Shopify/upload-to-release@v2.0.0
        with:
          name: SafariExtension.zip
          path: ./builds/SafariExtension.zip
          repo-token: ${{ secrets.GITHUB_TOKEN }}
